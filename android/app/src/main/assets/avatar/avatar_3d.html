<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PilotBot Real Human Copilot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            overflow: hidden;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            background: transparent;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #avatar-container {
            width: 100%;
            height: 100%;
            position: relative;
            border-radius: 50%;
            overflow: hidden;
            box-shadow: 0 0 12px rgba(99, 102, 241, 0.4);
            border: 2px solid rgba(226, 232, 240, 0.9);
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
            background: #0f172a;
        }
        .actor-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 0.2s ease-in-out;
            pointer-events: none;
        }
        .actor-video.active {
            opacity: 1;
        }
        #glow-ring {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            pointer-events: none;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>
    <div id="avatar-container">
        <!-- Female Real Actor Video Loops -->
        <video id="female-idle" class="actor-video active" src="female_idle.mp4" loop muted playsinline autoplay></video>
        <video id="female-speaking" class="actor-video" src="female_speaking.mp4" loop muted playsinline></video>

        <!-- Male Real Actor Video Loops -->
        <video id="male-idle" class="actor-video" src="male_idle.mp4" loop muted playsinline></video>
        <video id="male-speaking" class="actor-video" src="male_speaking.mp4" loop muted playsinline></video>

        <div id="glow-ring"></div>
    </div>

    <script>
        let currentGender = 'female';
        let currentState = 'idle';
        let isSpeaking = false;

        const container = document.getElementById('avatar-container');
        const videos = {
            'female-idle': document.getElementById('female-idle'),
            'female-speaking': document.getElementById('female-speaking'),
            'male-idle': document.getElementById('male-idle'),
            'male-speaking': document.getElementById('male-speaking'),
        };

        // Ensure all videos play silently and seamlessly
        Object.values(videos).forEach(v => {
            if (v) {
                v.muted = true;
                v.play().catch(() => {});
            }
        });

        function updateActiveVideo() {
            const activeKey = `${currentGender}-${isSpeaking ? 'speaking' : 'idle'}`;
            Object.keys(videos).forEach(key => {
                const vid = videos[key];
                if (key === activeKey) {
                    vid.classList.add('active');
                    vid.play().catch(() => {});
                } else {
                    vid.classList.remove('active');
                }
            });
            updateGlowEffect();
        }

        function setGender(gender) {
            currentGender = (gender === 'male') ? 'male' : 'female';
            updateActiveVideo();
        }

        function setState(state) {
            currentState = state;
            isSpeaking = (state === 'speaking');
            updateActiveVideo();
        }

        function setLipOpenness(val) {
            const speakingNow = (val > 0.15);
            if (speakingNow !== isSpeaking) {
                isSpeaking = speakingNow;
                updateActiveVideo();
            }
        }

        function triggerWink() {
            container.style.transform = 'scale(0.95)';
            setTimeout(() => { container.style.transform = 'scale(1.0)'; }, 200);
        }

        function triggerTap() {
            triggerWink();
            if (window.AndroidBridge && window.AndroidBridge.onAvatarClicked) {
                window.AndroidBridge.onAvatarClicked();
            }
        }

        function updateGlowEffect() {
            let borderColor = '#E2E8F0';
            let shadowColor = 'rgba(99, 102, 241, 0.4)';

            switch (currentState) {
                case 'speaking':
                    borderColor = '#A78BFA';
                    shadowColor = 'rgba(139, 92, 246, 0.7)';
                    break;
                case 'listening':
                    borderColor = '#34D399';
                    shadowColor = 'rgba(16, 185, 129, 0.7)';
                    break;
                case 'thinking':
                    borderColor = '#60A5FA';
                    shadowColor = 'rgba(56, 189, 248, 0.7)';
                    break;
                case 'alert':
                    borderColor = '#FB923C';
                    shadowColor = 'rgba(249, 115, 22, 0.7)';
                    break;
                default: // idle
                    borderColor = '#E2E8F0';
                    shadowColor = 'rgba(99, 102, 241, 0.4)';
                    break;
            }

            container.style.borderColor = borderColor;
            container.style.boxShadow = `0 0 12px ${shadowColor}`;
        }

        container.addEventListener('pointerdown', triggerTap);

        // Global JS API for Android Bridge
        window.setAvatarGender = setGender;
        window.setAvatarState = setState;
        window.setLipOpenness = setLipOpenness;
        window.triggerWink = triggerWink;
        window.triggerTap = triggerTap;

        document.addEventListener('DOMContentLoaded', () => {
            updateActiveVideo();
        });
    </script>
</body>
</html>
