<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PilotBot 3D Digital Copilot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            overflow: hidden;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            background: transparent;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #avatar-container {
            width: 100%;
            height: 100%;
            position: relative;
            border-radius: 50%;
            overflow: hidden;
            background: radial-gradient(circle at 50% 35%, #1e293b 0%, #090d16 100%);
            border: 2.5px solid #cbd5e1;
            box-shadow: 0 0 14px rgba(99, 102, 241, 0.45);
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }
        canvas {
            display: block;
            width: 100% !important;
            height: 100% !important;
        }
    </style>
    <script src="three.min.js"></script>
    <script src="GLTFLoader.js"></script>
</head>
<body>
    <div id="avatar-container"></div>

    <script>
        // =========================================================================
        // PilotBot 60 FPS 3D Digital Human Engine (WebGL PBR + Skeletal Dynamics)
        // =========================================================================
        let scene, camera, renderer;
        let femaleGroup, maleGroup;
        let activeGroup = null;
        let activeLoadedAvatar = null;
        const loadedAvatars = { female: null, male: null };
        const avatarMixers = { female: null, male: null };
        const animationClock = new THREE.Clock();

        let currentGender = 'female';
        let currentState = 'idle';
        let lipOpenness = 0.0;
        let targetLipOpenness = 0.0;

        let headRotX = 0, headRotY = 0, headRotZ = 0;
        let targetHeadRotX = 0, targetHeadRotY = 0, targetHeadRotZ = 0;

        const container = document.getElementById('avatar-container');

        function init() {
            const width = container.clientWidth || window.innerWidth || 200;
            const height = container.clientHeight || window.innerHeight || 200;

            scene = new THREE.Scene();

            camera = new THREE.PerspectiveCamera(36, width / height, 0.1, 50);
            camera.position.set(0, 0.28, 2.15);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
            renderer.setSize(width, height);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1.0, 2.0));
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.35;
            renderer.outputEncoding = THREE.sRGBEncoding;
            container.appendChild(renderer.domElement);

            // Studio 3-Point Cockpit Lighting
            const ambient = new THREE.AmbientLight(0xffeedd, 1.2);
            scene.add(ambient);

            const keyLight = new THREE.DirectionalLight(0xffffff, 1.4);
            keyLight.position.set(1.5, 2.5, 2.0);
            scene.add(keyLight);

            const fillLight = new THREE.DirectionalLight(0x93c5fd, 0.85);
            fillLight.position.set(-1.8, 0.8, 1.5);
            scene.add(fillLight);

            const rimLight = new THREE.DirectionalLight(0xc084fc, 1.3);
            rimLight.position.set(0, 2.5, -2.0);
            scene.add(rimLight);

            // Construct 3D Characters
            femaleGroup = build3DCharacter('female');
            maleGroup = build3DCharacter('male');

            scene.add(femaleGroup.root);
            scene.add(maleGroup.root);

            // Use actual rigged GLB characters when available. The procedural avatar remains a
            // resilient fallback for devices where a model cannot be decoded by WebGL.
            loadRiggedAvatar('female', 'female.glb');
            loadRiggedAvatar('male', 'male.glb');

            setGender(currentGender);
            updateGlow();

            container.addEventListener('pointerdown', () => {
                triggerTap();
                if (window.AndroidBridge && window.AndroidBridge.onAvatarClicked) {
                    window.AndroidBridge.onAvatarClicked();
                }
            });

            window.addEventListener('resize', onResize);
            animate(0);
        }

        function loadRiggedAvatar(gender, assetName) {
            const loader = new THREE.GLTFLoader();
            loader.load(assetName, (gltf) => {
                const root = gltf.scene;
                const bounds = new THREE.Box3().setFromObject(root);
                const size = bounds.getSize(new THREE.Vector3());
                const maxDimension = Math.max(size.x, size.y, size.z) || 1;
                const scale = 1.65 / maxDimension;
                root.scale.setScalar(scale);

                const normalizedBounds = new THREE.Box3().setFromObject(root);
                const center = normalizedBounds.getCenter(new THREE.Vector3());
                root.position.set(-center.x, -normalizedBounds.min.y - 0.96, 0);
                root.userData.restY = root.position.y;
                root.visible = false;
                scene.add(root);

                loadedAvatars[gender] = root;
                if (gltf.animations && gltf.animations.length) {
                    const mixer = new THREE.AnimationMixer(root);
                    mixer.clipAction(gltf.animations[0]).play();
                    avatarMixers[gender] = mixer;
                }
                setGender(currentGender);
            }, undefined, (error) => {
                // Keep the existing procedural avatar available when a vendor GLB is invalid.
                console.warn('Avatar model failed to load:', assetName, error);
            });
        }

        // Exquisite 3D Humanoid Character Constructor
        function build3DCharacter(gender) {
            const isFemale = (gender === 'female');
            const root = new THREE.Group();

            // PBR Materials
            const skinColor = isFemale ? 0xffdfd0 : 0xf6d4be;
            const skinMat = new THREE.MeshStandardMaterial({
                color: skinColor,
                roughness: 0.45,
                metalness: 0.05,
            });

            const clothColor = isFemale ? 0x0284c7 : 0x1e3a8a;
            const clothMat = new THREE.MeshStandardMaterial({
                color: clothColor,
                roughness: 0.75,
            });

            const hairColor = isFemale ? 0x3e2723 : 0x1f2937;
            const hairMat = new THREE.MeshStandardMaterial({
                color: hairColor,
                roughness: 0.58,
                metalness: 0.15,
            });

            const eyeWhiteMat = new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.15 });
            const irisMat = new THREE.MeshStandardMaterial({ color: isFemale ? 0x451a03 : 0x1e293b, roughness: 0.2 });
            const pupilMat = new THREE.MeshBasicMaterial({ color: 0x050505 });
            const lipMat = new THREE.MeshStandardMaterial({
                color: isFemale ? 0xdb2777 : 0xb45309,
                roughness: isFemale ? 0.28 : 0.55,
                metalness: 0.06,
            });
            const teethMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.2 });
            const mouthInsideMat = new THREE.MeshBasicMaterial({ color: 0x3b0710 });

            // 1. Torso & Shoulders
            const bodyJoint = new THREE.Group();
            root.add(bodyJoint);

            const torso = new THREE.Mesh(
                new THREE.CylinderGeometry(0.38, 0.48, 0.72, 24),
                clothMat
            );
            torso.position.set(0, -0.45, -0.05);
            bodyJoint.add(torso);

            const collar = new THREE.Mesh(
                new THREE.TorusGeometry(0.18, 0.045, 12, 24),
                new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.5 })
            );
            collar.rotation.x = Math.PI / 2;
            collar.position.set(0, -0.09, 0.02);
            bodyJoint.add(collar);

            // Neck
            const neck = new THREE.Mesh(
                new THREE.CylinderGeometry(0.11, 0.13, 0.22, 16),
                skinMat
            );
            neck.position.set(0, 0.02, -0.02);
            bodyJoint.add(neck);

            // 2. Head Joint (Rigged 3D Pivot for Nods & Gaze)
            const headJoint = new THREE.Group();
            headJoint.position.set(0, 0.14, 0);
            bodyJoint.add(headJoint);

            // Cranium Mesh
            const headGeo = new THREE.SphereGeometry(0.36, 32, 24);
            headGeo.scale(0.92, 1.15, 1.0);
            const headMesh = new THREE.Mesh(headGeo, skinMat);
            headMesh.position.set(0, 0.28, 0);
            headJoint.add(headMesh);

            // Chin & Jaw
            const chinGeo = new THREE.ConeGeometry(0.18, 0.26, 16);
            chinGeo.scale(isFemale ? 0.92 : 1.16, 1.0, 0.82);
            const chinMesh = new THREE.Mesh(chinGeo, skinMat);
            chinMesh.rotation.x = Math.PI;
            chinMesh.position.set(0, 0.02, 0.12);
            headJoint.add(chinMesh);

            // Nose
            const noseGeo = new THREE.ConeGeometry(0.045, 0.12, 12);
            noseGeo.scale(0.8, 1.0, 1.2);
            const noseMesh = new THREE.Mesh(noseGeo, skinMat);
            noseMesh.rotation.x = 0.2;
            noseMesh.position.set(0, 0.24, 0.36);
            headJoint.add(noseMesh);

            // 3. 3D Eyes
            const eyeSpacing = isFemale ? 0.145 : 0.155;
            const eyeY = 0.30;
            const eyeZ = 0.29;
            const eyeRadius = isFemale ? 0.065 : 0.062;

            function createEye(isLeft) {
                const eyeGroup = new THREE.Group();
                const sign = isLeft ? -1 : 1;
                eyeGroup.position.set(sign * eyeSpacing, eyeY, eyeZ);

                const eyeball = new THREE.Mesh(new THREE.SphereGeometry(eyeRadius, 16, 16), eyeWhiteMat);
                eyeGroup.add(eyeball);

                const iris = new THREE.Mesh(new THREE.CylinderGeometry(0.034, 0.034, 0.02, 16), irisMat);
                iris.rotation.x = Math.PI / 2;
                iris.position.set(0, 0, eyeRadius * 0.9);
                eyeGroup.add(iris);

                const pupil = new THREE.Mesh(new THREE.CylinderGeometry(0.016, 0.016, 0.022, 16), pupilMat);
                pupil.rotation.x = Math.PI / 2;
                pupil.position.set(0, 0, eyeRadius * 0.92);
                eyeGroup.add(pupil);

                const highlight = new THREE.Mesh(new THREE.SphereGeometry(0.01, 8, 8), new THREE.MeshBasicMaterial({ color: 0xffffff }));
                highlight.position.set(sign * 0.014, 0.014, eyeRadius * 0.95);
                eyeGroup.add(highlight);

                // Eyelid BlendShape
                const upperLidGeo = new THREE.SphereGeometry(eyeRadius * 1.06, 16, 10, 0, Math.PI * 2, 0, Math.PI / 2);
                const upperLid = new THREE.Mesh(upperLidGeo, skinMat);
                upperLid.rotation.x = -Math.PI * 0.46;
                eyeGroup.add(upperLid);

                return { eyeGroup, upperLid, iris };
            }

            const leftEye = createEye(true);
            const rightEye = createEye(false);
            headJoint.add(leftEye.eyeGroup);
            headJoint.add(rightEye.eyeGroup);

            // 4. 3D Mouth & Dynamic Jaw
            const mouthJoint = new THREE.Group();
            mouthJoint.position.set(0, 0.12, 0.32);
            headJoint.add(mouthJoint);

            const mouthCavity = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.08, 0.1), mouthInsideMat);
            mouthCavity.position.set(0, 0, -0.04);
            mouthJoint.add(mouthCavity);

            const upperTeeth = new THREE.Mesh(new THREE.BoxGeometry(0.10, 0.025, 0.04), teethMat);
            upperTeeth.position.set(0, 0.02, -0.01);
            mouthJoint.add(upperTeeth);

            const lowerTeeth = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.022, 0.04), teethMat);
            lowerTeeth.position.set(0, -0.02, -0.01);
            mouthJoint.add(lowerTeeth);

            const upperLip = new THREE.Mesh(new THREE.TorusGeometry(0.065, 0.016, 8, 16, Math.PI), lipMat);
            upperLip.rotation.x = Math.PI;
            upperLip.position.set(0, 0.018, 0.01);
            mouthJoint.add(upperLip);

            const lowerLip = new THREE.Mesh(new THREE.TorusGeometry(0.062, 0.018, 8, 16, Math.PI), lipMat);
            lowerLip.position.set(0, -0.018, 0.01);
            mouthJoint.add(lowerLip);

            // 5. 3D Hair
            const hairGroup = new THREE.Group();
            headJoint.add(hairGroup);

            if (isFemale) {
                const hairTop = new THREE.Mesh(
                    new THREE.SphereGeometry(0.39, 24, 16, 0, Math.PI * 2, 0, Math.PI * 0.65),
                    hairMat
                );
                hairTop.position.set(0, 0.32, -0.02);
                hairGroup.add(hairTop);

                const bangL = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.08, 0.55, 12), hairMat);
                bangL.position.set(-0.28, 0.05, 0.12);
                bangL.rotation.z = 0.2;
                hairGroup.add(bangL);

                const bangR = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.08, 0.55, 12), hairMat);
                bangR.position.set(0.28, 0.05, 0.12);
                bangR.rotation.z = -0.2;
                hairGroup.add(bangR);
            } else {
                const hairTop = new THREE.Mesh(
                    new THREE.SphereGeometry(0.38, 20, 16, 0, Math.PI * 2, 0, Math.PI * 0.55),
                    hairMat
                );
                hairTop.position.set(0, 0.34, 0.0);
                hairTop.scale.set(1.02, 1.15, 1.05);
                hairGroup.add(hairTop);

                const hairFront = new THREE.Mesh(new THREE.ConeGeometry(0.25, 0.20, 12), hairMat);
                hairFront.rotation.x = -0.4;
                hairFront.position.set(0, 0.52, 0.22);
                hairGroup.add(hairFront);
            }

            return {
                root,
                bodyJoint,
                headJoint,
                leftEye,
                rightEye,
                mouthJoint,
                lowerLip,
                upperLip,
                lowerTeeth,
                mouthCavity
            };
        }

        function setGender(gender) {
            currentGender = (gender === 'male') ? 'male' : 'female';
            const loaded = loadedAvatars[currentGender];
            if (loaded) {
                femaleGroup.root.visible = false;
                maleGroup.root.visible = false;
                if (loadedAvatars.female) loadedAvatars.female.visible = currentGender === 'female';
                if (loadedAvatars.male) loadedAvatars.male.visible = currentGender === 'male';
                activeLoadedAvatar = loaded;
                activeGroup = null;
                return;
            }
            if (loadedAvatars.female) loadedAvatars.female.visible = false;
            if (loadedAvatars.male) loadedAvatars.male.visible = false;
            activeLoadedAvatar = null;
            if (currentGender === 'male') {
                femaleGroup.root.visible = false;
                maleGroup.root.visible = true;
                activeGroup = maleGroup;
            } else {
                femaleGroup.root.visible = true;
                maleGroup.root.visible = false;
                activeGroup = femaleGroup;
            }
        }

        function setState(state) {
            currentState = state;
            switch(state) {
                case 'listening':
                    targetHeadRotX = 0.06;
                    targetHeadRotY = -0.24; // Turns attentively towards driver
                    targetHeadRotZ = 0.05;
                    break;
                case 'thinking':
                    targetHeadRotX = -0.15; // Tilts head up thoughtfully
                    targetHeadRotY = 0.18;
                    targetHeadRotZ = -0.08;
                    break;
                case 'speaking':
                    targetHeadRotX = 0.0;
                    targetHeadRotY = 0.0;
                    targetHeadRotZ = 0.0;
                    break;
                case 'alert':
                    targetHeadRotX = 0.12;
                    targetHeadRotY = 0.0;
                    targetHeadRotZ = 0.0;
                    break;
                default: // idle
                    targetHeadRotX = 0.0;
                    targetHeadRotY = 0.0;
                    targetHeadRotZ = 0.0;
                    break;
            }
            updateGlow();
        }

        function setLipOpenness(val) {
            targetLipOpenness = Math.max(0.0, Math.min(1.0, val));
        }

        function triggerWink() {
            targetHeadRotX = -0.16; // Friendly nod
            setTimeout(() => { targetHeadRotX = 0.0; }, 320);
        }

        function triggerTap() {
            triggerWink();
        }

        function updateGlow() {
            let borderColor = '#E2E8F0';
            let shadowColor = 'rgba(99, 102, 241, 0.45)';

            switch (currentState) {
                case 'speaking':
                    borderColor = '#A78BFA';
                    shadowColor = 'rgba(139, 92, 246, 0.75)';
                    break;
                case 'listening':
                    borderColor = '#34D399';
                    shadowColor = 'rgba(16, 185, 129, 0.75)';
                    break;
                case 'thinking':
                    borderColor = '#60A5FA';
                    shadowColor = 'rgba(56, 189, 248, 0.75)';
                    break;
                case 'alert':
                    borderColor = '#FB923C';
                    shadowColor = 'rgba(249, 115, 22, 0.75)';
                    break;
                default:
                    borderColor = '#E2E8F0';
                    shadowColor = 'rgba(99, 102, 241, 0.45)';
                    break;
            }

            container.style.borderColor = borderColor;
            container.style.boxShadow = `0 0 14px ${shadowColor}`;
        }

        // 60 FPS 3D Skeletal Animation Loop
        let nextBlinkTime = performance.now() + 2000;
        let isBlinking = false;
        let blinkPhase = 0;

        function animate(time) {
            requestAnimationFrame(animate);

            const delta = animationClock.getDelta();
            const activeMixer = avatarMixers[currentGender];
            if (activeMixer) activeMixer.update(delta);

            if (activeLoadedAvatar) {
                const t = time * 0.001;
                const breath = Math.sin(t * 1.8) * 0.006;
                activeLoadedAvatar.position.y = activeLoadedAvatar.userData.restY + breath;
                activeLoadedAvatar.rotation.y += (targetHeadRotY - activeLoadedAvatar.rotation.y) * 0.04;
                renderer.render(scene, camera);
                return;
            }

            if (!activeGroup) return;

            const t = time * 0.001;

            // 1. 3D Physical Breathing
            const breathY = Math.sin(t * 1.8) * 0.015;
            const breathScale = 1.0 + Math.sin(t * 1.8) * 0.01;
            activeGroup.bodyJoint.position.y = breathY;
            activeGroup.bodyJoint.scale.set(breathScale, breathScale, breathScale);

            // 2. 3D Eyelid Blinking
            if (time >= nextBlinkTime && !isBlinking) {
                isBlinking = true;
                blinkPhase = 0;
            }
            if (isBlinking) {
                blinkPhase += 0.16;
                if (blinkPhase >= Math.PI) {
                    isBlinking = false;
                    nextBlinkTime = time + 2500 + Math.random() * 2500;
                }
            }
            const currentBlink = isBlinking ? (Math.sin(blinkPhase) * 0.95) : 0.0;
            const lidRot = -Math.PI * 0.46 + (currentBlink * Math.PI * 0.46);
            activeGroup.leftEye.upperLid.rotation.x = lidRot;
            activeGroup.rightEye.upperLid.rotation.x = lidRot;

            // 3. 3D Speech Cadence & Nodding
            let speechNod = 0;
            if (currentState === 'speaking') {
                speechNod = Math.sin(t * 7.5) * 0.045;
            }

            headRotX += (targetHeadRotX + speechNod - headRotX) * 0.1;
            headRotY += (targetHeadRotY - headRotY) * 0.1;
            headRotZ += (targetHeadRotZ - headRotZ) * 0.1;

            activeGroup.headJoint.rotation.x = headRotX;
            activeGroup.headJoint.rotation.y = headRotY;
            activeGroup.headJoint.rotation.z = headRotZ;

            // 4. 3D Lip-Sync Jaw Opening & Lip Morphing
            lipOpenness += (targetLipOpenness - lipOpenness) * 0.25;

            activeGroup.lowerLip.position.y = -0.018 - lipOpenness * 0.055;
            activeGroup.lowerLip.scale.set(1.0 + lipOpenness * 0.15, 1.0 + lipOpenness * 0.65, 1.0);
            activeGroup.upperLip.position.y = 0.018 + lipOpenness * 0.015;
            activeGroup.lowerTeeth.position.y = -0.02 - lipOpenness * 0.035;
            activeGroup.mouthCavity.scale.y = 1.0 + lipOpenness * 2.2;

            renderer.render(scene, camera);
        }

        function onResize() {
            const width = container.clientWidth || window.innerWidth;
            const height = container.clientHeight || window.innerHeight;
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
        }

        window.setAvatarGender = setGender;
        window.setAvatarState = setState;
        window.setLipOpenness = setLipOpenness;
        window.triggerWink = triggerWink;
        window.triggerTap = triggerTap;

        window.onload = init;
    </script>
</body>
</html>
