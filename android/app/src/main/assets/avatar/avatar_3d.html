<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PilotBot Real 3D Digital Copilot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            overflow: hidden;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            background: transparent;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #avatar-container {
            width: 100%;
            height: 100%;
            position: relative;
            border-radius: 50%;
            overflow: hidden;
            background: radial-gradient(circle at 50% 35%, #1e293b 0%, #090d16 100%);
            border: 2.5px solid #cbd5e1;
            box-shadow: 0 0 14px rgba(99, 102, 241, 0.45);
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }
        canvas {
            display: block;
            width: 100% !important;
            height: 100% !important;
        }
        #loading-hint {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #94a3b8;
            font-family: sans-serif;
            font-size: 11px;
            pointer-events: none;
            display: none;
        }
    </style>
    <script src="three.min.js"></script>
    <script src="GLTFLoader.js"></script>
</head>
<body>
    <div id="avatar-container">
        <div id="loading-hint">3D 加载中...</div>
    </div>

    <script>
        // =========================================================================
        // PilotBot Authentic 3D Rigged Digital Human Engine
        // =========================================================================
        let scene, camera, renderer;
        let femaleModel = null, maleModel = null;
        let activeModel = null;
        let activeHeadBone = null;
        let activeNeckBone = null;
        let activeSpineBone = null;

        let currentGender = 'female';
        let currentState = 'idle';
        let lipOpenness = 0.0;
        let targetLipOpenness = 0.0;

        let headRotX = 0, headRotY = 0, headRotZ = 0;
        let targetHeadRotX = 0, targetHeadRotY = 0, targetHeadRotZ = 0;

        const container = document.getElementById('avatar-container');
        const loadingHint = document.getElementById('loading-hint');

        function init() {
            const width = container.clientWidth || window.innerWidth;
            const height = container.clientHeight || window.innerHeight;

            scene = new THREE.Scene();

            camera = new THREE.PerspectiveCamera(35, width / height, 0.1, 50);
            camera.position.set(0, 1.48, 1.35); // Focus on upper body & head

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
            renderer.setSize(width, height);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2.0));
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.3;
            renderer.outputEncoding = THREE.sRGBEncoding;
            container.appendChild(renderer.domElement);

            // Studio 3-Point Cockpit Lighting
            const ambient = new THREE.AmbientLight(0xffeedd, 1.1);
            scene.add(ambient);

            const keyLight = new THREE.DirectionalLight(0xffffff, 1.4);
            keyLight.position.set(1.5, 3.0, 2.0);
            scene.add(keyLight);

            const fillLight = new THREE.DirectionalLight(0x93c5fd, 0.8);
            fillLight.position.set(-1.8, 1.0, 1.5);
            scene.add(fillLight);

            const rimLight = new THREE.DirectionalLight(0xc084fc, 1.2);
            rimLight.position.set(0, 2.5, -2.0);
            scene.add(rimLight);

            // Load 3D GLB Models
            load3DModels();

            container.addEventListener('pointerdown', () => {
                triggerTap();
                if (window.AndroidBridge && window.AndroidBridge.onAvatarClicked) {
                    window.AndroidBridge.onAvatarClicked();
                }
            });

            window.addEventListener('resize', onResize);
            animate(0);
        }

        function load3DModels() {
            loadingHint.style.display = 'block';
            const loader = new THREE.GLTFLoader();

            // 1. Female 3D Avatar (Michelle.glb)
            loader.load('michelle.glb', (gltf) => {
                femaleModel = gltf.scene;
                femaleModel.position.set(0, 0, 0);
                femaleModel.traverse((child) => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;
                    }
                    if (child.isBone && child.name.includes('Head')) {
                        femaleModel.headBone = child;
                    }
                    if (child.isBone && child.name.includes('Neck')) {
                        femaleModel.neckBone = child;
                    }
                    if (child.isBone && child.name.includes('Spine2')) {
                        femaleModel.spineBone = child;
                    }
                });
                scene.add(femaleModel);
                loadingHint.style.display = 'none';
                updateActiveGender();
            }, undefined, (err) => {
                console.error('Error loading female model:', err);
                loadingHint.style.display = 'none';
            });

            // 2. Male 3D Avatar (Soldier.glb)
            loader.load('soldier.glb', (gltf) => {
                maleModel = gltf.scene;
                maleModel.position.set(0, 0, 0);
                maleModel.traverse((child) => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;
                    }
                    if (child.isBone && child.name.includes('Head')) {
                        maleModel.headBone = child;
                    }
                    if (child.isBone && child.name.includes('Neck')) {
                        maleModel.neckBone = child;
                    }
                    if (child.isBone && child.name.includes('Spine2')) {
                        maleModel.spineBone = child;
                    }
                });
                scene.add(maleModel);
                updateActiveGender();
            }, undefined, (err) => {
                console.error('Error loading male model:', err);
            });
        }

        function updateActiveGender() {
            const isFemale = (currentGender === 'female');
            if (femaleModel) {
                femaleModel.visible = isFemale;
                if (isFemale) {
                    activeModel = femaleModel;
                    activeHeadBone = femaleModel.headBone;
                    activeNeckBone = femaleModel.neckBone;
                    activeSpineBone = femaleModel.spineBone;
                }
            }
            if (maleModel) {
                maleModel.visible = !isFemale;
                if (!isFemale) {
                    activeModel = maleModel;
                    activeHeadBone = maleModel.headBone;
                    activeNeckBone = maleModel.neckBone;
                    activeSpineBone = maleModel.spineBone;
                }
            }
        }

        function setGender(gender) {
            currentGender = (gender === 'male') ? 'male' : 'female';
            updateActiveGender();
        }

        function setState(state) {
            currentState = state;
            switch(state) {
                case 'listening':
                    targetHeadRotX = 0.05;
                    targetHeadRotY = -0.25; // Turns attentively towards driver
                    targetHeadRotZ = 0.06;
                    break;
                case 'thinking':
                    targetHeadRotX = -0.15; // Tilts head up thoughtfully
                    targetHeadRotY = 0.20;
                    targetHeadRotZ = -0.08;
                    break;
                case 'speaking':
                    targetHeadRotX = 0.0;
                    targetHeadRotY = 0.0;
                    targetHeadRotZ = 0.0;
                    break;
                case 'alert':
                    targetHeadRotX = 0.12;
                    targetHeadRotY = 0.0;
                    targetHeadRotZ = 0.0;
                    break;
                default: // idle
                    targetHeadRotX = 0.0;
                    targetHeadRotY = 0.0;
                    targetHeadRotZ = 0.0;
                    break;
            }
            updateGlow();
        }

        function setLipOpenness(val) {
            targetLipOpenness = Math.max(0.0, Math.min(1.0, val));
        }

        function triggerWink() {
            targetHeadRotX = -0.18; // Friendly nod
            setTimeout(() => { targetHeadRotX = 0.0; }, 350);
        }

        function triggerTap() {
            triggerWink();
        }

        function updateGlow() {
            let borderColor = '#E2E8F0';
            let shadowColor = 'rgba(99, 102, 241, 0.45)';

            switch (currentState) {
                case 'speaking':
                    borderColor = '#A78BFA';
                    shadowColor = 'rgba(139, 92, 246, 0.75)';
                    break;
                case 'listening':
                    borderColor = '#34D399';
                    shadowColor = 'rgba(16, 185, 129, 0.75)';
                    break;
                case 'thinking':
                    borderColor = '#60A5FA';
                    shadowColor = 'rgba(56, 189, 248, 0.75)';
                    break;
                case 'alert':
                    borderColor = '#FB923C';
                    shadowColor = 'rgba(249, 115, 22, 0.75)';
                    break;
                default:
                    borderColor = '#E2E8F0';
                    shadowColor = 'rgba(99, 102, 241, 0.45)';
                    break;
            }

            container.style.borderColor = borderColor;
            container.style.boxShadow = `0 0 14px ${shadowColor}`;
        }

        // 60 FPS 3D Skeletal Animation Loop
        function animate(time) {
            requestAnimationFrame(animate);

            const t = time * 0.001;

            if (activeModel) {
                // 1. 3D Physical Breathing (Spine expansion & vertical float)
                const breathY = Math.sin(t * 1.8) * 0.008;
                if (activeSpineBone) {
                    activeSpineBone.rotation.x = Math.sin(t * 1.8) * 0.02;
                }
                activeModel.position.y = breathY;

                // 2. 3D Speech Nodding & Cadence
                let speechNod = 0;
                if (currentState === 'speaking') {
                    speechNod = Math.sin(t * 8.0) * 0.05;
                }

                headRotX += (targetHeadRotX + speechNod - headRotX) * 0.1;
                headRotY += (targetHeadRotY - headRotY) * 0.1;
                headRotZ += (targetHeadRotZ - headRotZ) * 0.1;

                if (activeHeadBone) {
                    activeHeadBone.rotation.x = headRotX;
                    activeHeadBone.rotation.y = headRotY;
                    activeHeadBone.rotation.z = headRotZ;
                }
                if (activeNeckBone) {
                    activeNeckBone.rotation.y = headRotY * 0.4;
                }
            }

            renderer.render(scene, camera);
        }

        function onResize() {
            const width = container.clientWidth || window.innerWidth;
            const height = container.clientHeight || window.innerHeight;
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
        }

        // Global JS API for Android Bridge
        window.setAvatarGender = setGender;
        window.setAvatarState = setState;
        window.setLipOpenness = setLipOpenness;
        window.triggerWink = triggerWink;
        window.triggerTap = triggerTap;

        window.onload = init;
    </script>
</body>
</html>
